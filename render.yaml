services:
  - type: web
    name: ableconnect-api
    runtime: python
    rootDir: backend
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    disk:
      name: ableconnect-private-documents
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ableconnect-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: CERTIFICATES_STORAGE_DIR
        value: /var/data/certificates
      - key: SEED_DEMO_DATA
        value: "false"
      - key: AUTO_CREATE_SCHEMA
        value: "false"

databases:
  - name: ableconnect-db
    plan: 0.1c-256mb
    databaseName: ableconnect
    user: ableconnect
    diskSizeGB: 15
